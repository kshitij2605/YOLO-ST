# JFULL-split1-s17: J0 recipe on the full official split-1 train list (660 videos); evaluated once on split-1 test (268 videos). Derived from configs/yolost_jhmdb_j0_split1_s17_40ep.yaml.

data:
  annot_file: ./data/ucf24/JHMDB/JHMDB-GT.pkl
  clip_length: 40
  dataset: jhmdb
  filter_empty_clips: true
  img_size: 288
  num_workers: 8
  root: ./data/ucf24/JHMDB/Frames
  split_index: 0
  stride: 1
eval:
  conf_thresh: 0.005
  nms_iou_thresh: 0.5
loss:
  lambda_bnd: 0.0
  lambda_box: 7.5
  lambda_cls: 0.5
  lambda_dfl: 1.5
  lambda_memory: 0.05
  lambda_obj: 1.5
  lambda_query_boundary: 0.25
  lambda_query_box: 5.0
  lambda_query_cls: 1.0
  lambda_query_coverage: 1.0
  lambda_query_end: 0.5
  lambda_query_fragmentation: 0.5
  lambda_query_giou: 2.0
  lambda_query_interval_iou: 2.0
  lambda_query_start: 0.5
  lambda_query_visibility: 1.0
  query_cost_box: 5.0
  query_cost_cls: 2.0
  query_cost_coverage: 1.0
  query_cost_fragmentation: 0.5
  query_cost_giou: 2.0
  query_cost_interval: 2.0
  query_cost_visibility: 1.0
model:
  apt_actor_context: true
  apt_actor_context_depth: 2
  apt_actor_context_dim: 128
  apt_actor_context_dropout: 0.05
  apt_actor_context_heads: 4
  apt_actor_context_slots: 1
  apt_adapter_depth: 1
  apt_adapter_dropout: 0.05
  apt_adapter_kernel: 3
  apt_adapter_temporal_kernel: 3
  apt_class_context: true
  apt_class_context_dim: 128
  apt_class_context_dropout: 0.05
  apt_context_dim: 128
  apt_context_dropout: 0.05
  apt_context_gate: true
  apt_cross_clip_memory: true
  apt_cross_clip_memory_bidirectional: true
  apt_cross_clip_memory_chunk: 8
  apt_cross_clip_memory_dim: 128
  apt_cross_clip_memory_dropout: 0.05
  apt_pyramid_adapter: true
  apt_tube_queries: true
  apt_tube_query_actor_aligned: false
  apt_tube_query_count: 8
  apt_tube_query_depth: 6
  apt_tube_query_dim: 256
  apt_tube_query_dropout: 0.1
  apt_tube_query_factorized: true
  apt_tube_query_frames: 32
  apt_tube_query_heads: 8
  apt_tube_query_instances_per_actor: 2
  apt_tube_query_interval_pyramid: true
  apt_tube_query_intervals: true
  apt_tube_query_memory_grid: 14
  apt_tube_query_shared_grad_scales:
  - 0.0
  - 0.2
  - 0.0
  apt_tube_query_task_adapter_ratio: 0.25
  apt_tube_query_task_adapter_scales:
  - true
  - false
  - true
  apt_tube_query_task_adapter_temporal_kernel: 3
  apt_tube_query_task_adapters: true
  backbone_frame_sampling: uniform
  backbone_frames: 32
  dtype: float32
  freeze_backbone: false
  keyframe_frames: 16
  keyframe_freeze: true
  keyframe_micro_batch: 8
  keyframe_pretrained_path: ./pretrained/yolo11l.pt
  keyframe_pyramid: true
  keyframe_scales:
  - true
  - true
  - true
  keyframe_version: l
  model_id: MCG-NJU/videomae-large-finetuned-kinetics
  native_motion_actor_floor: 0.1
  native_motion_actor_local: true
  native_motion_channel_ratio: 0.25
  native_motion_freeze: true
  native_motion_init: ./experiments/phase3a_150ep/final.pt
  native_motion_pyramid: true
  num_classes: 21
  reg_max: 16
  temporal_adapter: true
  temporal_adapter_depth: 2
  temporal_adapter_dropout: 0.05
  temporal_adapter_expansion: 2
  temporal_adapter_kernel: 5
  type: videomae
  unfreeze_last_n_blocks: 8
output:
  epoch_checkpoints: weights_only
  exp_dir: ./experiments/jhmdb_jr288_split1_s17_40ep
  save_interval: 10
train:
  amp_dtype: bfloat16
  backbone_lr_multiplier: 0.1
  backward_loss_divisor: 1
  batch_size: 8
  clip_grad_norm: 1.0
  ema: true
  ema_decay: 0.999
  ema_warmup: 100
  epochs: 40
  grad_accum: 4
  keyframe_lr_multiplier: 1.0
  lr: 0.0001
  mixed_precision: true
  motion_fusion_lr_multiplier: 1.0
  nonfinite_abort_steps: 25
  optimizer: adamw
  scheduler: cosine
  seed: 17
  tube_query_lr_multiplier: 1.0
  tube_task_adapter_lr_multiplier: 1.0
  warmup_epochs: 1.0
  weight_decay: 0.05
